<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Föhndiagramm Tirol / Südtirol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.1.0/chartjs-plugin-annotation.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.2.0/chartjs-plugin-zoom.min.js"></script>
<style>
  :root{
    --ink:#1C2B3A;
    --paper:#E9EDEC;
    --panel:#FFFFFF;
    --warm:#D68A3C;
    --cool:#3E6E8E;
    --alert:#C1443C;
    --hairline:#C9CFCD;
    --muted:#5B6B72;

    --line-primary:#1C2B3A;
    --line-secondary:#B9C2C0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding:32px 20px 64px;
  }
  .wrap{max-width:1320px;margin:0 auto;}

  header{margin-bottom:22px;}
  .title-row{ display:flex; align-items:center; gap:14px; }
  .title-row img.logo{ width:56px; height:56px; border-radius:50%; flex-shrink:0; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--cool);
    margin-bottom:6px;
    display:flex;align-items:center;gap:8px;
  }
  .eyebrow .dot{
    width:7px;height:7px;border-radius:50%;
    background:#22C55E;
    animation:pulse 2.4s ease-in-out infinite;
  }
  .eyebrow.stale .dot{
    background:#DC2626;
    animation:fastBlink 0.6s steps(1,end) infinite;
  }
  .eyebrow-stale-text{
    color:#DC2626; font-weight:700;
    animation:fastBlink 0.6s steps(1,end) infinite;
  }
  @keyframes fastBlink{ 0%,49%{opacity:1;} 50%,100%{opacity:.25;} }
  @media (prefers-reduced-motion:reduce){ .eyebrow .dot{animation:none;} .eyebrow.stale .dot{animation:none;} .eyebrow-stale-text{animation:none;} }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  h1{
    font-size:clamp(28px,4vw,40px);
    margin:0;
    font-weight:700;
    letter-spacing:-0.01em;
  }

  .legend-note{
    font-size:12.5px; color:var(--muted); margin-top:10px;
    display:flex; flex-wrap:wrap; gap:16px; align-items:center;
  }
  .legend-note span{display:inline-flex; align-items:center; gap:6px;}
  .swatch{width:14px;height:14px;border-radius:3px;display:inline-block;}
  .swatch.line{width:20px;height:3px;border-radius:0;}

  .table-collapse{ margin-top:4px; }
  .table-summary{
    cursor:pointer; list-style:none;
    background:#F1F3F2; border-radius:8px;
    padding:10px 16px; margin-bottom:12px;
  }
  .table-summary::-webkit-details-marker{ display:none; }
  .table-summary:hover{ background:#EBEEED; }
  .table-summary-title{ font-weight:600; font-size:14px; color:var(--ink); display:block; }
  .table-summary-sub{ font-size:12.5px; color:var(--cool); font-weight:600; display:block; margin-top:2px; }
  .table-collapse:not([open]) .when-open{ display:none; }
  .table-collapse[open] .when-closed{ display:none; }
  .table-collapse .legend-note{ margin-top:14px; }

  .global-desc{
    background:var(--panel); border:1px solid var(--hairline); border-radius:12px;
    padding:16px 20px; margin-top:16px;
  }
  .global-desc p{
    font-size:14px; line-height:1.65; color:#3A4750; max-width:80ch;
    white-space:pre-line; margin:0;
  }
  .global-desc details{ margin-top:8px; }
  .global-desc details p{ margin-top:8px; }
  .global-desc summary{
    cursor:pointer; color:var(--cool); font-size:13.5px; font-weight:600;
    list-style:none; display:inline-block;
  }
  .global-desc summary::-webkit-details-marker{ display:none; }
  .global-desc summary:hover{ text-decoration:underline; }
  .global-desc summary::after{ content:'▾'; margin-left:5px; font-size:11px; }
  .global-desc details[open] summary::after{ content:'▴'; }
  .global-desc .desc-attr{
    font-size:12px; color:var(--muted); font-style:italic; margin-top:12px;
  }
  .global-desc .desc-attr a{ color:var(--cool); }

  .section{
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:14px;
    padding:24px;
    margin-top:24px;
    opacity:0; transform:translateY(6px);
    animation:rise .5s ease forwards;
  }
  .section:nth-of-type(2){animation-delay:.08s;}
  @keyframes rise{to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){ .section{opacity:1;transform:none;animation:none;} }

  .section h2{
    font-size:20px; margin:0 0 14px; font-weight:700;
  }

  .section-grid{
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  .table-wrap{
    max-height:480px;
    overflow-y:auto;
    border:1px solid var(--hairline);
    border-radius:10px;
  }
  table{
    border-collapse:collapse;
    width:100%;
    font-size:12px;
    font-family:'IBM Plex Mono', monospace;
  }
  thead tr.group th{
    position:sticky; top:0; z-index:2;
    height:28px;
    background:#F1F3F2;
    border-bottom:1px solid var(--hairline);
    padding:0 7px;
    font-weight:700; text-align:left;
    font-size:11.5px; letter-spacing:.03em; text-transform:uppercase;
    font-family:'IBM Plex Sans', sans-serif;
  }
  thead tr.sub th{
    position:sticky; top:28px; z-index:1;
    background:var(--panel);
    border-bottom:1px solid var(--hairline);
    padding:6px 7px;
    text-align:left;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
  }
  tbody td{
    padding:4px 7px;
    border-bottom:1px solid #EEF1F0;
    white-space:nowrap;
  }
  tbody tr:hover td{ background:#F5F7F6; }
  td.delta-cell{ font-weight:700; }
  .hint-text{
    font-family:'IBM Plex Sans', sans-serif; font-weight:700; font-size:10.5px;
  }

  /* Δ-Stufen: die Delta-Zelle bekommt die volle Farbe, der Rest der Zeile ist
     deutlich transparenter (Kontrast bewusst hoch, damit der Unterschied
     gut sichtbar ist). Keine gesonderte Hervorhebung der aktuellsten Zeile
     mehr - die steht durch ihre Position (oben) ohnehin heraus. */
  tbody tr.hint-pre td{ background:rgba(62,110,142,0.04); }
  tbody tr.hint-pre td.delta-cell{ background:rgba(62,110,142,0.19); }

  tbody tr.hint-soft td{ background:rgba(62,110,142,0.25); }
  tbody tr.hint-soft td.delta-cell{ background:rgba(62,110,142,0.40); }

  tbody tr.hint-hard td{ background:rgba(46,109,164,0.72); color:#fff; }
  tbody tr.hint-hard td.delta-cell{ background:rgba(46,109,164,0.90); }
  tbody tr.hint-hard .hint-text{ color:#fff; }
  tbody tr.hint-hard:hover td{ background:rgba(46,109,164,0.72); }

  /* Aktuellste Zeile: eigene grüne Hervorhebung im selben Modus wie die
     Δ-Stufen (Δ-Zelle kräftiger, Rest der Zeile transparenter) - überschreibt
     eine eventuelle Δ-Stufenfarbe, da sie unabhängig vom Schweregrad gilt. */
  tbody tr.current td{ background:rgba(46,163,89,0.12) !important; color:var(--ink) !important; }
  tbody tr.current td.delta-cell{ background:rgba(46,163,89,0.32) !important; }
  tbody tr.current .hint-text{ color:var(--ink) !important; }

  .chart-wrap{ position:relative; touch-action: pan-y; height:460px; }
  canvas.foehn-chart{ width:100% !important; height:100% !important; display:block; }
  .arrow-svg{ position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
  .current-value-badge{
    position:absolute; top:10px; right:10px; z-index:3;
    background:rgba(255,255,255,0.94);
    border:1px solid var(--hairline);
    border-radius:10px;
    padding:7px 12px;
    text-align:right;
    box-shadow:0 3px 10px rgba(28,43,58,0.08);
    pointer-events:none;
  }
  .cvb-label{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:9.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); display:block;
  }
  .cvb-time{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px; font-weight:600; color:var(--ink); display:block; margin-top:1px;
  }
  .cvb-delta-row{
    display:flex; align-items:baseline; justify-content:flex-end; gap:5px; margin-top:2px;
  }
  .cvb-delta{
    font-family:'IBM Plex Mono', monospace;
    font-size:19px; font-weight:700; color:var(--ink);
  }
  .cvb-delta.warn{ color:var(--cool); }
  .cvb-delta.alert{ color:var(--alert); }
  .cvb-unit{ font-family:'IBM Plex Sans', sans-serif; font-size:10.5px; color:var(--muted); }
  .cvb-bang{
    color:var(--alert); font-weight:800; font-size:14px;
    animation:bangBlink 1s steps(1,end) infinite;
  }
  @keyframes bangBlink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
  @media (prefers-reduced-motion:reduce){ .cvb-bang{ animation:none; } }

  .zoom-hint{
    font-size:11px; color:var(--muted); text-align:right; margin-top:4px;
    font-family:'IBM Plex Mono', monospace;
  }
  .zoom-reset{
    font-size:11px; color:var(--cool); background:none; border:1px solid var(--hairline);
    border-radius:6px; padding:2px 8px; cursor:pointer; font-family:'IBM Plex Sans', sans-serif;
  }
  .zoom-reset:hover{ background:#F1F3F2; }

  .sources{
    margin-top:28px; padding-top:14px; border-top:1px solid var(--hairline);
    font-size:12.5px; color:var(--muted); line-height:1.8;
  }
  .sources a{ color:var(--cool); }

  .page-foot{
    text-align:center; color:var(--muted); font-size:12.5px;
    margin-top:14px; font-family:'IBM Plex Mono', monospace;
  }

  .loading, .error{ text-align:center; padding:60px 20px; color:var(--muted); }
  .error{ color:var(--alert); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow" id="eyebrow"><span class="dot"></span><span id="onAirText">On Air</span></div>
      <div class="title-row">
        <h1>Föhndiagramm GCV</h1>
        <img class="logo" src="./logo.png" alt="Logo Gleitschirm Club Vinschgau">
      </div>
      <div class="global-desc">
        <p id="descFirst"></p>
        <details>
          <summary>Mehr erfahren…</summary>
          <p id="descRest"></p>
          <p class="desc-attr">Textgrundlage: Föhndiagramm der <a href="https://home.provinz.bz.it/" target="_blank" rel="noopener">Wetterseite der Autonomen Provinz Bozen – Südtirol</a>.</p>
        </details>
      </div>
    </header>

    <div id="content" class="loading">Lade aktuelle Messwerte …</div>

    <div class="sources">
      Quelle Messdaten Südtirol: <a href="https://home.provinz.bz.it/" target="_blank" rel="noopener">Autonome Provinz Bozen – Südtirol</a><br>
      Quelle Messdaten Tirol: <a href="https://www.geosphere.at/de" target="_blank" rel="noopener">GeoSphere Austria</a>
    </div>
    <div class="page-foot" id="pageFoot"></div>
  </div>

<script>
  // Schwellenwerte, abgeglichen mit dem offiziellen Beschreibungstext (3 / 6 hPa).
  var TABLE_PRE = -2.5;
  var TABLE_SOFT = -3;
  var TABLE_HARD = -6;
  var CHART_LINE_SOFT = -3;
  var CHART_LINE_HARD = -6;
  var CHART_Y_MIN = -10, CHART_Y_MAX = 10;
  var MIN_LABEL_PX = 55; // Mindestabstand zwischen zwei X-Achsen-Beschriftungen

  var DESC_FIRST =
    "Die Grafik zeigt die aktuelle und vergangene Luftdruckdifferenz in Hektopascal [hPa] zwischen den jeweiligen Stationspaaren.";
  var DESC_REST =
    "Die Druckdifferenz gibt an, welche Windverhältnisse in den Alpen zu erwarten sind.\n" +
    "Bei negativen Werten, d.h. die Südtiroler Station hat den tieferen Druck als die Tiroler Station, ist in Südtirol Nordföhn zu erwarten. Je größer die Druckdifferenz, desto stärker weht der Föhn und desto weiter greift er in die südlichen Täler durch.\n" +
    "Erfahrungsgemäß muss die Druckdifferenz mindestens 3 hPa betragen, damit der Föhn die Täler nahe am Alpenhauptkamm (Obervinschgau, Wipptal) erfasst. Bei einer Differenz von über 6 hPa schafft es der Föhnwind in den meisten Fällen bis ins Unterland.\n" +
    "Im umgekehrten Fall, also bei positiven Werten, ist mit Südföhn an der Alpennordseite zu rechnen. Gleichzeitig frischt des Öfteren starker Taleinwind/Südwind auf Südtiroler Seite auf.";

  document.getElementById('descFirst').textContent = DESC_FIRST;
  document.getElementById('descRest').textContent = DESC_REST;

  var SHORT_CODES = { Bozen: 'BZ', Innsbruck: 'IBK', Meran: 'MER', Imst: 'IMST' };
  function shortCode(name){ return SHORT_CODES[name] || name; }

  var charts = {};
  var savedZoomRange = {};   // canvasId -> {min,max} - bleibt über Datenaktualisierungen erhalten, nicht über Seiten-Reload
  var syncingZoom = false;   // Schutz gegen Endlosschleife beim gegenseitigen Zoom-Abgleich
  var CHART_PAIR = { 'chart-bi': 'chart-im', 'chart-im': 'chart-bi' };

  // Wie viele Stunden standardmäßig sichtbar sein sollen, abhängig von der
  // Chart-Breite: schmal (Handy) -> 6h, breit (Desktop) -> volle 16h.
  // Pixelabstand für 2 Y-Achsen-Einheiten: am Laptop wie bisher (460px Höhe /
  // 10 Zwei-Einheiten-Schritte = 46px), am Handy 20% größer, dazwischen
  // linear interpoliert.
  function computeChartHeight(containerWidth){
    var minW = 380, maxW = 900; // Handy .. Laptop
    var desktopUnitPx = 460 / 10;           // 46px pro 2pt bei Laptop-Breite
    var mobileUnitPx = desktopUnitPx * 1.2; // 55,2px pro 2pt bei Handy-Breite
    var w = Math.max(minW, Math.min(maxW, containerWidth));
    var t = (w - minW) / (maxW - minW); // 0 = Handy, 1 = Laptop
    var unitPx = mobileUnitPx + t * (desktopUnitPx - mobileUnitPx);
    return Math.round(unitPx * 10);
  }

  function computeDefaultVisibleHours(containerWidth){
    var minW = 380, maxW = 900, minH = 6, maxH = 16;
    var w = Math.max(minW, Math.min(maxW, containerWidth));
    var t = (w - minW) / (maxW - minW);
    return minH + t * (maxH - minH);
  }

  // Sucht, von der Zielanzahl Stunden rückwärts gerechnet, die nächste volle
  // Stunde (damit der linke Rand immer auf :00 beginnt) und liefert den
  // passenden Index-Bereich für die Kategorie-Achse.
  function computeDefaultRange(labels, targetHours){
    if (!labels.length) return null;
    var pointsPerHour = 3; // 20-Minuten-Takt
    var idealStart = labels.length - 1 - Math.round(targetHours * pointsPerHour);
    var startIdx = -1;
    for (var i = Math.max(0, idealStart); i >= 0; i--){
      var label = labels[i];
      if (label && label.slice(-2) === '00') { startIdx = i; break; }
    }
    if (startIdx === -1) startIdx = 0;
    return { min: startIdx, max: labels.length - 1 };
  }

  function clearChartTooltip(chart){
    if (!chart) return;
    chart.setActiveElements([]);
    if (chart.tooltip) chart.tooltip.setActiveElements([], { x: 0, y: 0 });
    chart.update('none');
  }

  // Klick/Tipp außerhalb der eigentlichen Plot-Fläche (x/y-Achsen-Bereich)
  // blendet ein evtl. noch offenes Tooltip-Detailfeld wieder aus.
  document.addEventListener('click', function(e){
    Object.keys(charts).forEach(function(id){
      var chart = charts[id];
      if (!chart) return;
      var canvas = chart.canvas;
      var withinArea = false;
      if (e.target === canvas) {
        var rect = canvas.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var area = chart.chartArea;
        withinArea = !!area && x >= area.left && x <= area.right && y >= area.top && y <= area.bottom;
      }
      if (!withinArea) clearChartTooltip(chart);
    });
  });

  if (window.Chart && window['chartjs-plugin-annotation']) {
    Chart.register(window['chartjs-plugin-annotation']);
  }
  if (window.Chart && window.ChartZoom) {
    Chart.register(window.ChartZoom);
  }

  function num(v){
    var n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.'));
    return isNaN(n) ? null : n;
  }
  function fmt(v, digits){
    var n = num(v);
    if (n === null) return '—';
    return (n > 0 ? '+' : '') + n.toFixed(digits === undefined ? 1 : digits).replace('.', ',');
  }
  function getVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#999';
  }

  // Tabelle: Δ zuerst (wichtigster Wert), Datum/Uhrzeit nur einmal (stimmen für
  // beide Stationen überein), neueste Messung oben.
  function buildTable(pair){
    var rows = (pair.rows || []).slice().reverse(); // neueste zuerst
    var html = '<table><thead>' +
      '<tr class="group"><th colspan="3"></th><th>' + pair.leftLabel.toUpperCase() + '</th><th>' + pair.rightLabel.toUpperCase() + '</th><th></th></tr>' +
      '<tr class="sub"><th>ΔhPa</th><th></th><th>Uhrzeit</th><th>Luftdruck [hPa]</th><th>Luftdruck [hPa]</th><th>Datum</th></tr>' +
      '</thead><tbody>';

    rows.forEach(function(r, i){
      var d = num(r.delta);
      var tier = '';
      var hint = '';
      if (d !== null && d <= TABLE_HARD) { tier = 'hint-hard'; hint = 'Nordföhn!'; }
      else if (d !== null && d <= TABLE_SOFT) { tier = 'hint-soft'; }
      else if (d !== null && d <= TABLE_PRE) { tier = 'hint-pre'; }
      var cls = tier + (i === 0 ? ' current' : '');

      html += '<tr class="' + cls + '">' +
        '<td class="delta-cell">' + fmt(r.delta) + '</td>' +
        '<td class="hint-text">' + hint + '</td>' +
        '<td>' + (r.zeitLeft || '—') + '</td>' +
        '<td>' + fmt(r.wertLeft) + '</td><td>' + fmt(r.wertRight) + '</td>' +
        '<td>' + (r.datumLeft || '—') + '</td>' +
        '</tr>';
    });

    html += '</tbody></table>';
    return html;
  }

  function pctOfXAxisInPx(chart, pct){
    var area = chart.chartArea;
    if (!area) return 20;
    var width = area.right - area.left;
    return Math.max(6, width * pct);
  }

  function buildChart(canvasId, primary, secondary, yAxisTitle, primaryCode, secondaryCode){
    var rows = primary.rows || [];
    var secRows = (secondary && secondary.rows) || [];
    var labels = rows.map(function(r){ return r.zeitLeft; });
    var primaryData = rows.map(function(r){ return num(r.delta); });
    var offset = secRows.length - rows.length;
    var secondaryData = labels.map(function(_, i){
      var idx = i + offset;
      return (idx >= 0 && idx < secRows.length) ? num(secRows[idx].delta) : null;
    });

    var blueFill = 'rgba(62,110,142,0.2)';
    var redFill = 'rgba(193,68,60,0.2)';

    var annotations = {
      lineSoft: { type: 'line', yMin: CHART_LINE_SOFT, yMax: CHART_LINE_SOFT, borderColor: '#3399FF', borderWidth: 2 },
      lineHard: { type: 'line', yMin: CHART_LINE_HARD, yMax: CHART_LINE_HARD, borderColor: '#0000FF', borderWidth: 2.5 }
    };

    // Pfeil als eigenes SVG-Overlay (nicht über das Annotation-Plugin - dessen
    // arrowHeads-Funktion war unzuverlässig bei Breite/Transparenz).
    function updateArrowSvg(chart){
      var svg = document.getElementById('svg-' + canvasId);
      if (!svg) return;
      var area = chart.chartArea;
      var yScale = chart.scales.y;
      if (!area || !yScale || labels.length === 0) { svg.innerHTML = ''; return; }

      var centerX = (area.left + area.right) / 2;
      var y0 = yScale.getPixelForValue(0);
      var y2 = yScale.getPixelForValue(2);
      var y3 = yScale.getPixelForValue(-3);
      var y6 = yScale.getPixelForValue(-6);
      var y8 = yScale.getPixelForValue(-8);
      var y10 = yScale.getPixelForValue(-10);
      var textY = (y8 + y10) / 2; // exakt mittig zwischen y=-8 und y=-10, unabhängig von der Y-Skala
      var totalW = area.right - area.left;
      var yUnitPx = Math.abs(y0 - y2); // Pixelabstand für 2 Einheiten auf der Y-Achse
      var shaftW = Math.max(totalW * 0.09, yUnitPx);
      var headW = Math.max(totalW * 0.156, yUnitPx * 1.7);
      var color = 'rgba(51,153,255,0.2)';   // #3399FF bei 80% Transparenz (20% Deckkraft)
      var textColor = 'rgba(51,153,255,0.4)'; // 20%-Punkte weniger transparent als der Pfeil (Alpha 0,2 -> 0,4)

      svg.setAttribute('width', chart.width);
      svg.setAttribute('height', chart.height);
      svg.innerHTML =
        '<rect x="' + (centerX - shaftW / 2) + '" y="' + y3 + '" width="' + shaftW + '" height="' + (y6 - y3) + '" fill="' + color + '"></rect>' +
        '<polygon points="' + (centerX - headW / 2) + ',' + y6 + ' ' + (centerX + headW / 2) + ',' + y6 + ' ' + centerX + ',' + y8 + '" fill="' + color + '"></polygon>' +
        '<text x="' + centerX + '" y="' + textY + '" text-anchor="middle" dominant-baseline="middle" font-family="\'IBM Plex Sans\', sans-serif" font-weight="500" font-size="16.8" fill="' + textColor + '">NORDFÖHN</text>';
    }

    var arrowSvgPlugin = {
      id: 'arrowSvgSync-' + canvasId,
      afterLayout: function(chart){
        updateArrowSvg(chart);
        // Hammer.js (für Pinch-Zoom) setzt touch-action="none" per Inline-Style
        // auf das Canvas - das blockiert vertikales Scrollen mit dem Finger.
        // Hier zurück auf pan-y erzwingen: vertikales Scrollen bleibt möglich,
        // horizontales Ziehen/Pinch wird weiterhin vom Zoom-Plugin abgefangen.
        if (chart.canvas.style.touchAction !== 'pan-y') {
          chart.canvas.style.touchAction = 'pan-y';
        }
      }
    };

    // Kurze Tick-Striche auf der X-Achse an JEDEM tatsächlichen Datenpunkt
    // (nicht nur an den beschrifteten Stunden) - reine Positionsmarkierung.
    var tickMarksPlugin = {
      id: 'tickMarks-' + canvasId,
      afterDraw: function(chart){
        var xScale = chart.scales.x;
        var yScale = chart.scales.y;
        var area = chart.chartArea;
        if (!area) return;
        var ctx = chart.ctx;
        ctx.save();
        ctx.strokeStyle = '#9AA3A0';
        ctx.lineWidth = 1;

        // X-Achse: kurze Striche an JEDEM tatsächlichen Datenpunkt (nicht nur
        // an den beschrifteten Stunden).
        if (xScale) {
          for (var i = 0; i < labels.length; i++){
            var x = xScale.getPixelForValue(i);
            if (x < area.left - 1 || x > area.right + 1) continue; // nur im sichtbaren (ggf. gezoomten) Bereich
            ctx.beginPath();
            ctx.moveTo(x, area.bottom);
            ctx.lineTo(x, area.bottom + 4);
            ctx.stroke();
          }
        }

        // Y-Achse: kurze Striche an jeder beschrifteten Stelle (alle 2 Einheiten).
        if (yScale) {
          for (var v = CHART_Y_MIN; v <= CHART_Y_MAX; v += 2){
            var y = yScale.getPixelForValue(v);
            ctx.beginPath();
            ctx.moveTo(area.left - 4, y);
            ctx.lineTo(area.left, y);
            ctx.stroke();
          }
        }
        ctx.restore();
      }
    };

    // Zoom-Zustand bei Datenaktualisierung erhalten (nicht bei Seiten-Reload,
    // da savedZoomRange ein reines JS-Objekt im Speicher ist): falls schon ein
    // Bereich gemerkt wurde, den wiederverwenden - sonst responsiven
    // Standardbereich berechnen (schmal -> 6h, breit -> 16h, links auf volle
    // Stunde ausgerichtet).
    var containerEl = document.getElementById(canvasId).parentElement;
    var containerWidth = (containerEl && containerEl.clientWidth) || 800;
    var initialRange = savedZoomRange[canvasId];
    if (!initialRange && labels.length) {
      initialRange = computeDefaultRange(labels, computeDefaultVisibleHours(containerWidth));
    }

    var computedHeight = computeChartHeight(containerWidth);
    if (containerEl) containerEl.style.height = computedHeight + 'px';

    function handleZoomOrPan(ctx){
      var chart = ctx.chart;
      savedZoomRange[canvasId] = { min: chart.scales.x.min, max: chart.scales.x.max };
      if (syncingZoom) return;
      var otherId = CHART_PAIR[canvasId];
      var otherChart = charts[otherId];
      if (otherChart) {
        syncingZoom = true;
        otherChart.zoomScale('x', { min: chart.scales.x.min, max: chart.scales.x.max }, 'none');
        savedZoomRange[otherId] = { min: chart.scales.x.min, max: chart.scales.x.max };
        syncingZoom = false;
      }
    }

    var ctx = document.getElementById(canvasId).getContext('2d');
    if (charts[canvasId]) charts[canvasId].destroy();
    charts[canvasId] = new Chart(ctx, {
      type: 'line',
      plugins: labels.length ? [arrowSvgPlugin, tickMarksPlugin] : [],
      data: {
        labels: labels,
        datasets: [
          {
            label: secondaryCode,
            data: secondaryData,
            borderColor: 'rgba(185,194,192,0.6)',
            backgroundColor: 'transparent',
            borderWidth: 1.5,
            pointRadius: 0,
            tension: 0.35,
            cubicInterpolationMode: 'monotone',
            fill: false
          },
          {
            label: primaryCode,
            data: primaryData,
            borderColor: getVar('--line-primary'),
            backgroundColor: 'transparent',
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.35,
            cubicInterpolationMode: 'monotone',
            fill: 'origin',
            segment: {
              backgroundColor: function(segCtx){
                var y0 = segCtx.p0.parsed.y, y1 = segCtx.p1.parsed.y;
                return ((y0 + y1) / 2 < 0) ? blueFill : redFill;
              }
            }
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            mode: 'index', intersect: false,
            callbacks: {
              label: function(ctx){
                return ctx.dataset.label + ': ' + fmt(ctx.parsed.y) + ' hPa';
              }
            }
          },
          annotation: { annotations: annotations },
          zoom: {
            pan: { enabled: true, mode: 'x', onPanComplete: handleZoomOrPan },
            zoom: {
              wheel: { enabled: true },
              pinch: { enabled: true },
              mode: 'x',
              onZoomComplete: handleZoomOrPan
            },
            limits: { x: { min: 'original', max: 'original' } }
          }
        },
        scales: {
          x: {
            min: initialRange ? initialRange.min : undefined,
            max: initialRange ? initialRange.max : undefined,
            grid: { display: false, drawTicks: false },
            afterBuildTicks: function(axis){
              var allTicks = axis.ticks;
              var chartWidth = (axis.chart && axis.chart.width) || 600;
              var n = allTicks.length;
              if (n > 1 && (chartWidth / n) >= MIN_LABEL_PX) {
                return; // genug Platz für jeden sichtbaren Punkt (auch 20-Min-Werte)
              }
              var hourTicks = allTicks.filter(function(t){
                var label = axis.getLabelForValue(t.value);
                var parts = label ? label.split(':') : [];
                return parts.length === 2 && parts[1] === '00';
              });
              if (!hourTicks.length) { axis.ticks = []; return; }
              var maxLabels = Math.max(1, Math.floor(chartWidth / MIN_LABEL_PX));
              var step = Math.max(1, Math.ceil(hourTicks.length / maxLabels));
              axis.ticks = hourTicks.filter(function(t, i){ return i % step === 0; });
            },
            ticks: {
              maxRotation: 0,
              font: { family: "'IBM Plex Mono', monospace", size: 10 }, color: '#5B6B72'
            }
          },
          y: {
            min: CHART_Y_MIN, max: CHART_Y_MAX,
            title: { display: true, text: yAxisTitle, font: { size: 11, family: "'IBM Plex Sans', sans-serif" }, color: '#5B6B72' },
            grid: { color: '#EEF1F0', drawTicks: true, tickLength: 4 },
            ticks: { stepSize: 2, font: { family: "'IBM Plex Mono', monospace", size: 10 }, color: '#5B6B72' }
          }
        }
      }
    });
  }

  var latestInstants = {}; // pairKey -> Date - für den On-Air-Verzögerungscheck

  function buildCurrentValueBadge(primary){
    var rows = primary.rows || [];
    if (!rows.length) return '';
    var last = rows[rows.length - 1];
    var d = num(last.delta);
    var deltaClass = '';
    var bangs = '';
    if (d !== null && d <= TABLE_HARD) {
      deltaClass = 'alert';
      bangs = '<span class="cvb-bang" style="animation-delay:0s">!</span>' +
              '<span class="cvb-bang" style="animation-delay:.15s">!</span>' +
              '<span class="cvb-bang" style="animation-delay:.3s">!</span>';
    } else if (d !== null && d <= TABLE_SOFT) {
      deltaClass = 'warn';
      bangs = '<span class="cvb-bang">!</span>';
    }
    return '<span class="cvb-label">Aktuellster Wert</span>' +
      '<span class="cvb-time">' + (last.zeitLeft || '—') + '</span>' +
      '<div class="cvb-delta-row"><span class="cvb-delta ' + deltaClass + '">' + fmt(last.delta) + '</span><span class="cvb-unit">hPa</span>' + bangs + '</div>';
  }

  function renderSection(primary, secondary, tableElId, chartElId, chartInstId, yAxisTitle){
    if (!primary || !primary.rows || !primary.rows.length){
      document.getElementById(tableElId).innerHTML = '<div class="error" style="padding:24px;">Noch keine Daten für diese Passroute.</div>';
      return;
    }
    document.getElementById(tableElId).innerHTML = buildTable(primary);
    var badgeEl = document.getElementById('badge-' + chartElId);
    if (badgeEl) badgeEl.innerHTML = buildCurrentValueBadge(primary);
    var lastRow = primary.rows[primary.rows.length - 1];
    if (lastRow && lastRow.instantUTC) latestInstants[chartInstId] = new Date(lastRow.instantUTC);
    var primaryCode = shortCode(primary.leftLabel) + '-' + shortCode(primary.rightLabel);
    var secondaryCode = secondary ? (shortCode(secondary.leftLabel) + '-' + shortCode(secondary.rightLabel)) : '';
    buildChart(chartElId, primary, secondary, yAxisTitle, primaryCode, secondaryCode);
  }

  // Prüft regelmäßig (unabhängig vom Datenrefresh, da die Zeit ja
  // weiterläuft), ob der aktuellste bekannte Wert mehr als 1h alt ist.
  function checkDataFreshness(){
    var eyebrow = document.getElementById('eyebrow');
    var textEl = document.getElementById('onAirText');
    if (!eyebrow || !textEl) return;
    var now = Date.now();
    var maxAgeMs = 60 * 60 * 1000;
    var isStale = Object.keys(latestInstants).some(function(k){
      var t = latestInstants[k];
      return t && (now - t.getTime()) > maxAgeMs;
    });
    if (isStale) {
      eyebrow.classList.add('stale');
      textEl.innerHTML = 'On Air <span class="eyebrow-stale-text">· Zeitverzögerung &gt; 1h!</span>';
    } else {
      eyebrow.classList.remove('stale');
      textEl.textContent = 'On Air';
    }
  }
  setInterval(checkDataFreshness, 30 * 1000);


  function resetZoom(chartInstId){
    if (!charts[chartInstId]) return;
    charts[chartInstId].resetZoom();
    delete savedZoomRange[chartInstId];
    var otherId = CHART_PAIR[chartInstId];
    if (charts[otherId]) {
      charts[otherId].resetZoom();
      delete savedZoomRange[otherId];
    }
  }
  window.resetZoom = resetZoom;

  function legendHtml(){
    return '<div class="legend-note">' +
      '<span><span class="swatch" style="background:rgba(62,110,142,0.19)"></span>Δ ≤ -2,5 hPa</span>' +
      '<span><span class="swatch" style="background:rgba(62,110,142,0.40)"></span>Δ ≤ -3 hPa</span>' +
      '<span><span class="swatch" style="background:rgba(46,109,164,0.90)"></span>Δ ≤ -6 hPa (starker Nordföhn)</span>' +
      '<span><span class="swatch" style="background:rgba(46,163,89,0.32)"></span>aktuellster Wert</span>' +
      '</div>';
  }

  function render(data){
    var content = document.getElementById('content');
    content.className = '';
    var bi = data.bozenInnsbruck || { leftLabel: 'Bozen', rightLabel: 'Innsbruck' };
    var im = data.imstMeran || { leftLabel: 'Meran', rightLabel: 'Imst' };

    content.innerHTML =
      '<div class="section">' +
        '<h2>' + bi.leftLabel + ' - ' + bi.rightLabel + '</h2>' +
        '<div class="section-grid">' +
          '<div class="chart-wrap"><canvas class="foehn-chart" id="chart-bi"></canvas><svg class="arrow-svg" id="svg-chart-bi"></svg><div class="current-value-badge" id="badge-chart-bi"></div></div>' +
          '<div class="zoom-hint"><button class="zoom-reset" onclick="resetZoom(\'chart-bi\')">Zoom zurücksetzen</button> · Mausrad/Pinch zum Zoomen, Ziehen zum Verschieben</div>' +
          '<details class="table-collapse">' +
            '<summary class="table-summary">' +
              '<span class="table-summary-title">Details Luftdruckwerte</span>' +
              '<span class="table-summary-sub"><span class="when-closed">Mehr anzeigen…</span><span class="when-open">Weniger anzeigen…</span></span>' +
            '</summary>' +
            '<div class="table-wrap" id="table-bi"></div>' +
            legendHtml() +
          '</details>' +
        '</div>' +
      '</div>' +
      '<div class="section">' +
        '<h2>' + im.leftLabel + ' - ' + im.rightLabel + '</h2>' +
        '<div class="section-grid">' +
          '<div class="chart-wrap"><canvas class="foehn-chart" id="chart-im"></canvas><svg class="arrow-svg" id="svg-chart-im"></svg><div class="current-value-badge" id="badge-chart-im"></div></div>' +
          '<div class="zoom-hint"><button class="zoom-reset" onclick="resetZoom(\'chart-im\')">Zoom zurücksetzen</button> · Mausrad/Pinch zum Zoomen, Ziehen zum Verschieben</div>' +
          '<details class="table-collapse">' +
            '<summary class="table-summary">' +
              '<span class="table-summary-title">Details Luftdruckwerte</span>' +
              '<span class="table-summary-sub"><span class="when-closed">Mehr anzeigen…</span><span class="when-open">Weniger anzeigen…</span></span>' +
            '</summary>' +
            '<div class="table-wrap" id="table-im"></div>' +
            legendHtml() +
          '</details>' +
        '</div>' +
      '</div>';

    renderSection(data.bozenInnsbruck, data.imstMeran, 'table-bi', 'chart-bi', 'chart-bi', 'Druckdifferenz  ' + bi.leftLabel + ' - ' + bi.rightLabel + '  [hPa]');
    renderSection(data.imstMeran, data.bozenInnsbruck, 'table-im', 'chart-im', 'chart-im', 'Druckdifferenz  ' + im.leftLabel + ' - ' + im.rightLabel + '  [hPa]');

    document.getElementById('pageFoot').textContent = data.generatedAt
      ? ('Zuletzt aktualisiert: ' + data.generatedAt)
      : 'Noch kein Datenstand';

    checkDataFreshness();
  }

  function showError(err){
    var content = document.getElementById('content');
    content.className = 'error';
    content.textContent = 'Fehler beim Laden der Daten: ' + (err && err.message ? err.message : err);
  }

  function load(){
    fetch('./data/history.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(render)
      .catch(showError);
  }

  load();
  setInterval(load, 3 * 60 * 1000);
</script>
</body>
</html>
