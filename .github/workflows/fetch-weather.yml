name: Wetterdaten abrufen

on:
  schedule:
    # Fauler Fallback (Primär-Steuerung läuft jetzt über einen externen
    # Cron-Dienst - cron-job.org -, der alle 10 Minuten workflow_dispatch
    # auslöst, da GitHub's eigener schedule-Trigger nachweislich unzuverlässig
    # ist). Bewusst 2 Minuten NACH dem Raster (:02,:12,:22,...) statt exakt
    # darauf: kleiner Sicherheitspuffer, falls die Bürgernetz-API um Sekunden
    # zu spät veröffentlicht. Das Skript zielt dabei auf den aktuellsten
    # verfügbaren Wert (kein künstlicher Verzug mehr), mit großzügigem
    # Suchfenster (±25 Min., siehe WINDOW_MINUTES in fetch-weather.mjs) gegen
    # die empirisch bestätigte ~20-Minuten-Veröffentlichungsverzögerung der
    # Quelle. Eine Nachhol-Logik im Skript selbst holt zusätzlich automatisch
    # fehlende Slots nach, falls ein Lauf verzögert startet oder ausfällt.
    # Siehe scripts/fetch-weather.mjs für Details.
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch: {} # erlaubt manuelles Auslösen (auch durch den externen Cron-Dienst)

permissions:
  contents: write

# Falls ein Lauf doch mal hängen bleibt oder ungewöhnlich lange braucht, wird
# er beim nächsten planmäßigen Trigger ABGEBROCHEN statt dass sich nachfolgende
# Läufe dahinter aufstauen und die Zeitpunkte immer weiter verschieben (das war
# die Ursache für die früher beobachteten großen Verzögerungen). Die
# Nachhol-Logik im Skript holt einen dadurch übersprungenen Slot beim
# nächsten erfolgreichen Lauf automatisch nach.
# Eigene Concurrency-Gruppe pro Auslöse-Art (geplant vs. manuell) - so kann
# ein manuell gestarteter Lauf (workflow_dispatch) niemals mit einem
# planmäßigen Cron-Lauf um dieselbe "Warteschlange" konkurrieren oder ihn
# versehentlich verdrängen.
concurrency:
  group: fetch-weather-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Mit der jetzt parallelisierten Abruf-Logik (alle Slots und beide
    # Stationspaare gleichzeitig statt nacheinander) dauert ein Lauf normal
    # nur wenige Sekunden. 4 Minuten harte Obergrenze als Sicherheitsnetz -
    # danach lieber abbrechen und beim nächsten Trigger neu versuchen, statt
    # nachfolgende Läufe zu blockieren.
    timeout-minutes: 4
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wetterdaten abrufen
        run: node scripts/fetch-weather.mjs

      - name: Änderungen committen
        run: |
          git config user.name "foehn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json data/wind.json

          if git diff --quiet --cached; then
            echo "Keine Änderungen an data/history.json oder data/wind.json - nichts zu committen."
            exit 0
          fi

          git commit -m "Wetterdaten aktualisiert"

          # Robuster Push: falls zwischenzeitlich ein anderer Lauf gepusht hat,
          # neu holen (rebase) und erneut versuchen, statt den Lauf fehlschlagen
          # zu lassen und Daten zu verlieren.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push erfolgreich (Versuch $attempt)."
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $attempt), hole Änderungen und versuche erneut..."
            git pull --rebase origin main
            sleep 5
          done

          echo "Push nach mehreren Versuchen fehlgeschlagen."
          exit 1
