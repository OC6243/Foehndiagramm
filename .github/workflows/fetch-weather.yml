name: Wetterdaten abrufen

on:
  schedule:
    # Fauler Fallback (Primär-Steuerung läuft jetzt über einen externen
    # Cron-Dienst - cron-job.org -, der alle 5 Minuten workflow_dispatch
    # auslöst, da GitHub's eigener schedule-Trigger nachweislich unzuverlässig
    # ist). Läuft jetzt exakt auf dem 5-Minuten-Raster (:00,:05,:10,...) -
    # der Sicherheitspuffer gegen die Veröffentlichungsverzögerung der Quelle
    # sitzt seit Kurzem stattdessen direkt im Skript selbst (sleep() ganz am
    # Anfang, siehe fetch-weather.mjs), präziser auf ~10 Minuten abgestimmt
    # (empirisch für die seit Kurzem verwendete neue geoservices-Domain
    # gemessen, deutlich schneller als die frühere, gröbere Schätzung von
    # 10-20+ Minuten für die alte Domain). Großzügiges Suchfenster (±25 Min.,
    # siehe WINDOW_MINUTES in fetch-weather.mjs) bleibt zusätzlich als
    # Sicherheitsnetz bestehen. Eine Nachhol-Logik im Skript selbst holt
    # zusätzlich automatisch fehlende Slots nach, falls ein Lauf verzögert
    # startet oder ausfällt. Siehe scripts/fetch-weather.mjs für Details.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # erlaubt manuelles Auslösen (auch durch den externen Cron-Dienst)

permissions:
  contents: write

# Falls ein Lauf doch mal hängen bleibt oder ungewöhnlich lange braucht, wird
# er beim nächsten planmäßigen Trigger ABGEBROCHEN statt dass sich nachfolgende
# Läufe dahinter aufstauen und die Zeitpunkte immer weiter verschieben (das war
# die Ursache für die früher beobachteten großen Verzögerungen). Die
# Nachhol-Logik im Skript holt einen dadurch übersprungenen Slot beim
# nächsten erfolgreichen Lauf automatisch nach.
# EINE gemeinsame Concurrency-Gruppe für alle Auslöse-Arten (nicht mehr pro
# event_name getrennt): geplanter Fallback und externer Cron-Trigger erledigen
# inzwischen praktisch dieselbe Aufgabe im selben Takt - liefen sie in
# getrennten Gruppen, konnten zwei Läufe gleichzeitig aktiv sein und sich beim
# Commit/Push gegenseitig in die Quere kommen (führte zu Merge-Konflikten in
# den Datendateien). Mit einer gemeinsamen Gruppe wird ein überlappender Lauf
# sauber abgebrochen, statt in einen Konflikt zu laufen.
concurrency:
  group: fetch-weather
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Mit der jetzt parallelisierten Abruf-Logik (alle Slots und beide
    # Stationspaare gleichzeitig statt nacheinander) dauert ein Lauf normal
    # nur wenige Sekunden, plus die neu ergänzten 30s Vorlauf-Pufferzeit ganz
    # am Anfang von main() (siehe fetch-weather.mjs). 5 Minuten harte
    # Obergrenze als Sicherheitsnetz (um die zusätzlichen 30s erhöht) -
    # danach lieber abbrechen und beim nächsten Trigger neu versuchen, statt
    # nachfolgende Läufe zu blockieren.
    timeout-minutes: 5
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wetterdaten abrufen
        run: node scripts/fetch-weather.mjs

      - name: Änderungen committen
        run: |
          git config user.name "foehn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json data/wind.json

          if git diff --quiet --cached; then
            echo "Keine Änderungen an data/history.json oder data/wind.json - nichts zu committen."
            exit 0
          fi

          git commit -m "Wetterdaten aktualisiert"

          # Robuster Push: falls zwischenzeitlich ein anderer Lauf gepusht hat,
          # neu holen (rebase) und erneut versuchen, statt den Lauf fehlschlagen
          # zu lassen und Daten zu verlieren.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push erfolgreich (Versuch $attempt)."
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $attempt), hole Änderungen und versuche erneut..."
            if git pull --rebase origin main; then
              sleep 5
              continue
            fi
            # Echter Inhaltskonflikt (z.B. durch einen fast zeitgleichen
            # zweiten Lauf) - lässt sich nicht automatisch zusammenführen.
            # Statt fehlzuschlagen: eigenen Commit verwerfen und den Stand des
            # anderen, bereits erfolgreich gepushten Laufs übernehmen. Die
            # Daten sind dadurch ohnehin schon aktuell, ein erneuter Push ist
            # nicht nötig.
            echo "Rebase-Konflikt (vermutlich zeitgleicher zweiter Lauf) - übernehme den Stand von origin/main, da die Daten dadurch bereits aktuell sind."
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            exit 0
          done

          echo "Push nach mehreren Versuchen fehlgeschlagen."
          exit 1
